<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05020c">
<meta name="description" content="Jogo de fases em primeira pessoa sobre viés algorítmico, inspirado no estudo Gender Shades de Joy Buolamwini.">
<title>O Corredor Codificado</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305020c'/%3E%3Cpath d='M16 4 L25 11 L23 24 L16 28 L9 24 L7 11 Z' fill='none' stroke='%23FFC93C' stroke-width='2'/%3E%3Crect x='11' y='14' width='4' height='2' fill='%2300E5FF'/%3E%3Crect x='17' y='14' width='4' height='2' fill='%2300E5FF'/%3E%3C/svg%3E">
<style>
  :root{ --void:#05020c; --cyan:#00E5FF; --gold:#FFC93C; --mag:#FF2D9B; --bone:#F3EFE6; --fs:16px; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--void);color:var(--bone);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);
    -webkit-tap-highlight-color:transparent;touch-action:none}
  body.big{--fs:20px}
  canvas{display:block}
  #host{position:fixed;inset:0}

  /* botao de voltar para o blog: acima das telas de menu (z 20) e do HUD */
  #voltar-blog{position:fixed;top:max(.7rem,env(safe-area-inset-top));left:.8rem;z-index:60;
    display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .8rem .42rem .6rem;
    font:600 .74rem/1 system-ui,sans-serif;letter-spacing:.14em;
    color:#cfd8e6;text-decoration:none;background:rgba(5,2,12,.72);
    border:1px solid rgba(255,255,255,.22);border-radius:999px;
    backdrop-filter:blur(4px);transition:opacity .25s,color .2s,border-color .2s}
  #voltar-blog:hover{color:#FFC93C;border-color:rgba(255,201,60,.6)}
  #voltar-blog.off{opacity:0;pointer-events:none}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:1.1rem;padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem;
    background:radial-gradient(ellipse at 50% 40%,rgba(42,15,74,.92),rgba(5,2,12,.97) 70%);
    z-index:20;overflow-y:auto;text-align:center}
  .screen.on{display:flex}
  #s-title{background:linear-gradient(rgba(5,2,12,.72),rgba(5,2,12,.94)),
    url('https://d2ol7oe51mr4n9.cloudfront.net/user_3HBsC4pkD2oWljt5W8Aky7ZDxwD/2342ec04-0c5f-422f-ac07-7f7e965e67cc.jpg') center 30%/cover no-repeat}
  .aya-face{width:clamp(90px,16vw,150px);height:auto;border-radius:50%;
    border:2px solid var(--gold);box-shadow:0 0 34px rgba(255,201,60,.4);
    background:#05020c;object-fit:cover}
  .aya-tag{font-size:.68rem;letter-spacing:.22em;color:var(--gold);margin-top:.35rem}

  h1{font-size:clamp(1.8rem,6.5vw,4rem);font-weight:900;letter-spacing:.14em;line-height:1;
    color:var(--gold);text-shadow:0 0 30px rgba(255,201,60,.45)}
  h2{font-size:clamp(1.1rem,3.2vw,1.7rem);letter-spacing:.22em;color:var(--cyan);font-weight:700}
  .sub{max-width:48ch;color:#b9c6d4;font-size:1rem;line-height:1.6}
  .body{max-width:62ch;text-align:left;display:flex;flex-direction:column;gap:.75rem;
    color:#cfd8e3;line-height:1.65;font-size:.98rem}
  .body b,.body strong{color:var(--gold)}
  .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}

  button,.btn{font:inherit;font-weight:700;letter-spacing:.1em;cursor:pointer;
    padding:.85rem 1.6rem;border-radius:2px;border:2px solid var(--cyan);
    background:transparent;color:var(--cyan);transition:background .15s,color .15s;
    text-transform:uppercase;font-size:.92rem}
  button:hover,.btn:hover{background:var(--cyan);color:var(--void)}
  button.primary{border-color:var(--gold);color:var(--gold)}
  button.primary:hover{background:var(--gold);color:var(--void)}
  /* link com cara de botao secundario: mesma familia dos outros, um degrau
     mais discreto, porque sair nao e a acao principal desta tela */
  .botao-link{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;
    font:inherit;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    font-size:.78rem;padding:.6rem 1.15rem;border-radius:2px;
    border:2px solid rgba(207,216,230,.35);color:#cfd8e6;
    transition:background .15s,color .15s,border-color .15s}
  .botao-link:hover{background:#cfd8e6;color:var(--void);border-color:#cfd8e6}
  button.ghost{border-color:#4a4258;color:#9aa4b4;font-size:.78rem;padding:.5rem .9rem}
  button.ghost:hover{background:#4a4258;color:var(--bone)}

  .grid4{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr));gap:.6rem;max-width:620px;width:100%}
  .cell{border:1px solid #2a2050;padding:.6rem .3rem;background:rgba(0,0,0,.35)}
  .cell .n{font-size:1.35rem;font-weight:800}
  .cell .l{font-size:.62rem;letter-spacing:.06em;color:#8fa0b4;margin-top:.2rem}

  #vrslot{display:flex;justify-content:center}
  #vrslot button{position:static!important;width:auto!important;left:auto!important;
    bottom:auto!important;transform:none!important;border:2px solid var(--gold)!important;
    background:transparent!important;color:var(--gold)!important;opacity:1!important;
    padding:.85rem 1.6rem!important;font:inherit!important;font-weight:700!important;
    letter-spacing:.1em!important;border-radius:2px!important;cursor:pointer!important;
    font-size:.92rem!important;text-transform:uppercase}

  /* botões de tela: só em aparelho com toque, nunca em VR */
  #touch{position:fixed;right:.9rem;bottom:1.4rem;z-index:15;display:none;
    flex-direction:column;gap:.55rem;align-items:flex-end}
  body.touch #touch.on{display:flex}
  #touch button{padding:1rem 1.15rem;font-size:.72rem;background:rgba(5,2,12,.72);min-width:104px}
  #touch button.act{background:var(--gold);color:var(--void);border-color:var(--gold)}

  /* ---------- HUD fixo de tela (PC/celular; em VR o painel é dentro do mundo) */
  #hud2d{position:fixed;top:.9rem;left:.9rem;z-index:13;display:none;min-width:230px;pointer-events:none;
    background:rgba(5,2,12,.82);border:1px solid rgba(0,229,255,.45);padding:.7rem .9rem;
    font-size:.8rem;letter-spacing:.04em;backdrop-filter:blur(2px)}
  #hud2d.on{display:block}
  #hud2d .row{display:flex;justify-content:space-between;gap:1.2rem;margin:.18rem 0;align-items:baseline}
  #hud2d .lab{color:#8fb6c8;font-size:.62rem;letter-spacing:.16em}
  #hud2d .big{font-size:1.5rem;font-weight:800;color:var(--bone)}
  #hud2d .gold{color:var(--gold)} #hud2d .cyan{color:var(--cyan)} #hud2d .mag{color:var(--mag)}
  #hud2d .hearts span{display:inline-block;width:.85rem;height:.85rem;border-radius:50%;
    margin-left:.25rem;background:var(--mag)}
  #hud2d .hearts span.off{background:transparent;border:2px solid #4a4258}
  #maskbar{width:110px;height:.7rem;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
  #maskfill{position:absolute;inset:0;transform-origin:left;background:var(--cyan)}
  #hud2d .phase{margin-top:.4rem;padding-top:.35rem;border-top:1px solid rgba(255,201,60,.3);
    color:var(--gold);font-size:.66rem;letter-spacing:.14em}
  /* barra do chefe: no alto e no centro, longe do painel da esquerda */
  #bossbar{position:fixed;top:.9rem;left:50%;transform:translateX(-50%);z-index:14;display:none;
    width:min(520px,72vw);pointer-events:none;text-align:center}
  #bossbar.on{display:block}
  #bossbar .nome{font-size:.62rem;letter-spacing:.24em;color:var(--mag);font-weight:800;
    text-shadow:0 0 12px rgba(255,45,155,.6)}
  #bossbar .lab{font-size:.5rem;letter-spacing:.16em;color:#8fa0b4;margin-top:.1rem}
  #bossbar .trilho{height:.6rem;margin-top:.25rem;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,45,155,.5);position:relative;overflow:hidden}
  #bossfill{position:absolute;inset:0;transform-origin:left;background:var(--mag);
    box-shadow:0 0 18px rgba(255,45,155,.8);transition:transform .18s ease-out}
  #bossbar .estagio{font-size:.55rem;letter-spacing:.14em;margin-top:.2rem;color:var(--gold)}

  #aya2d{position:fixed;left:50%;transform:translateX(-50%);bottom:4.2rem;z-index:13;display:none;pointer-events:none;
    max-width:min(680px,92vw);background:rgba(5,2,12,.88);border:1px solid rgba(255,201,60,.55);
    padding:.65rem 1rem;font-size:.92rem;line-height:1.45}
  #aya2d.on{display:block}
  #aya2d b{color:var(--gold);margin-right:.5rem;letter-spacing:.12em}
  #banner2d{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:16;display:none;
    text-align:center;background:rgba(5,2,12,.9);border:2px solid var(--gold);
    padding:1.1rem 2.2rem;pointer-events:none}
  #banner2d.on{display:block;animation:bpop .35s ease-out}
  #banner2d h3{color:var(--gold);font-size:clamp(1.4rem,4.5vw,2.4rem);letter-spacing:.1em;margin-bottom:.35rem}
  #banner2d p{color:#cfd8e3;font-size:.95rem}
  @keyframes bpop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  #toast{position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:15;display:none;
    color:var(--gold);font-weight:900;font-size:1.5rem;text-shadow:0 0 18px rgba(255,201,60,.8);
    pointer-events:none}
  #toast.on{display:block;animation:tup .9s ease-out forwards}
  @keyframes tup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}

  #hint{position:fixed;left:50%;transform:translateX(-50%);top:.9rem;z-index:14;
    color:#05020c;background:var(--gold);font-size:.8rem;font-weight:700;letter-spacing:.04em;
    text-align:center;pointer-events:none;display:none;padding:.55rem 1rem;max-width:92vw;
    box-shadow:0 0 24px rgba(255,201,60,.35)}
  #hint.on{display:block}
  #hint b{display:block;font-size:.6rem;letter-spacing:.18em;opacity:.7;margin-bottom:.12rem}
  #keys{position:fixed;left:50%;transform:translateX(-50%);bottom:.8rem;z-index:14;
    color:#7f8ca0;font-size:.7rem;letter-spacing:.05em;text-align:center;
    pointer-events:none;display:none;padding:0 1rem}
  #keys.on{display:block}
  #dev{position:fixed;top:6px;left:8px;color:#0f0;font:12px monospace;z-index:30;display:none}
  .fine{font-size:.72rem;color:#6d7789;letter-spacing:.05em}

  /* ---------- celular: o topo e' estreito e nao cabe painel largo + objetivo */
  @media (max-width:820px){
    /* Em retrato a HUD comia o terco de cima da tela. Objetivo em uma linha
       so, com reticencias se nao couber, e painel bem mais baixo. */
    #hint{top:.4rem;left:.4rem;right:.4rem;transform:none;max-width:none;
      font-size:.66rem;padding:.3rem .55rem;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
    #hint b{display:none}
    #hud2d{left:.4rem;right:auto;min-width:0;padding:.35rem .6rem;font-size:.62rem;
      background:rgba(5,2,12,.62)}
    #hud2d .big{font-size:.95rem}
    #hud2d .lab{font-size:.58rem;letter-spacing:.12em}
    #hud2d .row{margin:.02rem 0;gap:.7rem}
    #hud2d .phase{margin-top:.2rem;padding-top:.2rem;font-size:.58rem}
    #maskbar{width:56px;height:.45rem}
    #hud2d .hearts span{width:.55rem;height:.55rem}
    /* os controles ja estao na tela inicial e em COMO JOGAR; aqui so cobriam
       os proprios botoes de toque */
    body.touch #keys{display:none!important}
    /* Os botoes ficam SO na metade direita. Andar e' o toque na metade
       esquerda da tela (main.js: clientX < innerWidth/2); botao ocupando o
       rodape inteiro comia essa metade e o jogador nao conseguia andar. */
    #touch{left:auto;right:.5rem;bottom:1rem;flex-direction:column;gap:.4rem;
      align-items:flex-end}
    #touch button{padding:.8rem 1rem;font-size:.66rem;min-width:88px}
    /* legenda encostada a esquerda, fora da coluna de botoes */
    #aya2d{left:.5rem;right:7.5rem;transform:none;max-width:none;
      bottom:1rem;font-size:.8rem;padding:.45rem .7rem;line-height:1.35}
    #toast{font-size:1.15rem;top:52%}
  }
</style>
</head>
<body>

<div id="host"></div>
<div id="dev"></div>

<div id="touch">
  <button id="b-mask"></button>
  <button id="b-duck"></button>
  <button id="b-jump"></button>
</div>
<div id="hint"></div>
<div id="keys"></div>

<div id="hud2d">
  <div class="row"><span class="lab" id="hl-face"></span><span class="big gold" id="hv-face">0/0</span></div>
  <div class="row"><span class="lab" id="hl-time"></span><span class="big" id="hv-time">–:––</span></div>
  <div class="row"><span class="lab" id="hl-lives"></span><span class="hearts" id="hv-lives"></span></div>
  <div class="row"><span class="lab" id="hl-mask"></span>
    <span style="display:flex;align-items:center;gap:.5rem"><span id="maskbar"><span id="maskfill"></span></span><span id="hv-mask" style="font-size:.62rem;color:#8fa0b4"></span></span></div>
  <div class="phase" id="hv-phase"></div>
  <!-- quadros por segundo: sem este numero na tela ninguem consegue dizer se
       o jogo esta a 60 no proprio aparelho, so achar que esta ou nao esta -->
  <div class="phase" id="hv-fps" style="opacity:.85"></div>
</div>
<div id="bossbar">
  <div class="nome" id="boss-nome"></div>
  <div class="lab" id="boss-lab"></div>
  <div class="trilho"><span id="bossfill"></span></div>
  <div class="estagio" id="boss-estagio"></div>
</div>
<div id="aya2d"><b id="aya2d-name"></b><span id="aya2d-text"></span></div>
<div id="banner2d"><h3 id="banner2d-t"></h3><p id="banner2d-s"></p></div>
<div id="toast"></div>

<!-- VOLTAR PARA O BLOG. Quem entra no jogo pelo blog nao tinha caminho de
     volta: so o botao de voltar do navegador, e no totem da feira nem isso,
     porque ele roda em tela cheia sem barra nenhuma. Este fica por cima de
     tudo, em qualquer tela do jogo, e some enquanto se joga para nao ocupar
     canto de tela no meio de uma fase. -->
<a id="voltar-blog" href="../index.html">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="15" height="15"
       fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5l-7 7 7 7"/>
  </svg>
  <span>BLOG</span>
</a>

<section class="screen on" id="s-title">
  <video class="aya-face" src="https://d8j0ntlcm91z4.cloudfront.net/user_3Dh1q30VATNRdqHL0qWXAdgGyv8/hf_20260806_212107_31ec2646-f050-4da4-baec-602f160a2cf4.mp4" poster="https://d8j0ntlcm91z4.cloudfront.net/user_3Dh1q30VATNRdqHL0qWXAdgGyv8/hf_20260806_204404_58318017-1aec-4b39-8c99-94a4344ea1c8.png" autoplay muted loop playsinline aria-label="AYA, a guia do jogo"></video>
  <div class="aya-tag">AYA · SUA GUIA NO SISTEMA</div>
  <h1 id="t-title"></h1>
  <p class="sub" id="t-sub"></p>
  <div id="vrslot"></div>
  <div class="row">
    <button class="primary" id="b-flat"></button>
    <button id="b-how"></button>
    <button id="b-credits"></button>
  </div>
  <!-- O mesmo caminho de volta na fileira do menu, e nao so no canto: na tela
       de inicio ele tem que estar onde a pessoa esta olhando, junto com as
       outras escolhas. O do canto continua existindo para as outras telas. -->
  <div class="row" style="margin-top:.1rem">
    <a class="botao-link" id="b-blog" href="../index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="14" height="14"
           fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12H5M11 6l-6 6 6 6"/>
      </svg>
      VOLTAR PARA O BLOG
    </a>
  </div>
  <p class="fine" id="t-ctrl"></p>
  <p class="fine" id="t-vrmsg"></p>
  <div class="row" style="margin-top:.3rem">
    <button class="ghost" id="b-sound"></button>
    <button class="ghost" id="b-shake"></button>
    <button class="ghost" id="b-flash"></button>
    <button class="ghost" id="b-text"></button>
    <button class="ghost" id="b-snap"></button>
    <button class="ghost" id="b-head"></button>
  </div>
</section>

<section class="screen" id="s-how">
  <h2 id="h-title"></h2>
  <div class="body" id="h-body"></div>
  <div class="body" id="h-ctrl" style="color:#8fa0b4;font-size:.85rem"></div>
  <button id="b-how-back"></button>
</section>

<section class="screen" id="s-credits">
  <h2 id="c-title"></h2>
  <div class="body" id="c-body"></div>
  <p class="fine" id="c-link"></p>
  <button id="b-cred-back"></button>
</section>

<section class="screen" id="s-res">
  <h2 id="r-title"></h2>
  <p class="sub" id="r-body"></p>
  <div class="grid4" id="r-grid"></div>
  <div class="row">
    <button class="primary" id="b-again"></button>
    <button id="b-res-credits"></button>
  </div>
</section>

<script type="module">
import { Game, LEVELS } from './src/main.js';
import { STR } from './src/strings.js';

// ?edit=1: joga as fases salvas pelo editor.html (localStorage deste
// navegador) no lugar das do levels.js. Serve para testar um ajuste antes de
// exportar o arquivo. SEM o parâmetro nada aqui roda: produção nunca lê o
// storage, então uma edição esquecida no navegador não muda o site no ar.
if (new URLSearchParams(location.search).has('edit')) {
  try {
    const d = JSON.parse(localStorage.getItem('corredor.editor.v1') || 'null');
    if (d && Array.isArray(d.levels) && d.levels.length) {
      LEVELS.length = 0;
      for (const l of d.levels) LEVELS.push(l);
      console.info('[editor] jogando com as fases do editor:', LEVELS.length);
    }
  } catch (e) { console.warn('[editor] não consegui ler as fases editadas:', e); }
}

const $ = (id) => document.getElementById(id);
const isTouch = matchMedia('(hover:none)').matches || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

$('t-title').textContent   = STR.title;
$('t-sub').textContent     = STR.subtitle;
$('b-flat').textContent    = STR.btn_flat;
$('b-how').textContent     = STR.btn_how;
$('b-credits').textContent = STR.btn_credits;
$('h-title').textContent   = STR.how_title;
$('c-title').textContent   = STR.credits_title;
$('c-link').textContent    = STR.credits_link;
$('b-how-back').textContent  = STR.btn_back;
$('b-cred-back').textContent = STR.btn_back;
$('b-again').textContent     = STR.btn_again;
$('b-res-credits').textContent = STR.btn_credits;
$('b-jump').textContent = STR.btn_jump;
$('b-duck').textContent = STR.btn_duck;
$('b-mask').textContent = STR.btn_mask;
$('t-ctrl').textContent = isTouch ? STR.ctrl_touch : STR.ctrl_desk;
$('keys').textContent   = isTouch ? STR.ctrl_touch : STR.ctrl_desk;

STR.how_body.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('h-body').appendChild(p); });
[STR.ctrl_title, STR.ctrl_vr, STR.ctrl_desk, STR.ctrl_touch, STR.ctrl_pad]
  .forEach(t => { const p = document.createElement('p'); p.textContent = t; $('h-ctrl').appendChild(p); });
STR.credits_body.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('c-body').appendChild(p); });

const game = new Game($('host'));
window.game = game;

try {
  const vb = game.vrButton();
  $('vrslot').appendChild(vb);
  const PT = { 'ENTER VR': STR.btn_vr, 'EXIT VR': 'SAIR DO VR', 'VR NOT SUPPORTED': 'VR INDISPONÍVEL' };
  const relabel = () => { const t = PT[vb.textContent.trim().toUpperCase()]; if (t && vb.textContent !== t) vb.textContent = t; };
  relabel();
  new MutationObserver(relabel).observe(vb, { childList: true, characterData: true, subtree: true });
} catch (e) { /* navegador sem WebXR */ }
if (!navigator.xr) $('t-vrmsg').textContent = STR.vr_unsupported;

const screens = ['s-title', 's-how', 's-credits', 's-res'];
function show(id) {
  screens.forEach(s => $(s).classList.toggle('on', s === id));
  ['touch', 'hint', 'keys'].forEach(e => $(e).classList.remove('on'));
}
function hideAll() {
  screens.forEach(s => $(s).classList.remove('on'));
  ['touch', 'hint', 'keys'].forEach(e => $(e).classList.add('on'));
}

$('b-how').onclick     = () => show('s-how');
$('b-credits').onclick = () => show('s-credits');
$('b-res-credits').onclick = () => show('s-credits');
$('b-how-back').onclick  = () => show('s-title');
$('b-cred-back').onclick = () => show(game.mode === 'over' ? 's-res' : 's-title');

// ?fase=2 comeca direto na fase pedida, de 1 a 5. Existe para a demonstracao
// de palco e para o totem: chegar na mascara branca jogando a fase 1 inteira
// leva uns dois minutos e meio, que uma apresentacao nao tem.
const FASE_URL = (() => {
  const n = parseInt(new URLSearchParams(location.search).get('fase'), 10);
  return Number.isFinite(n) && n >= 1 && n <= LEVELS.length ? n - 1 : 0;
})();
function play() { hideAll(); game.start(FASE_URL); }
$('b-flat').onclick = play;
$('b-again').onclick = play;

// botões de tela: pulo e máscara são toque, agachar é liga/desliga
for (const [id, act] of [['b-jump', 'jump'], ['b-mask', 'mask'], ['b-duck', 'duck']]) {
  const el = $(id);
  const fire = (e) => {
    e.preventDefault(); e.stopPropagation();
    game.press(act);
    if (act === 'duck') el.classList.toggle('act', game.duckBtn);
    else { el.classList.add('act'); setTimeout(() => el.classList.remove('act'), 140); }
  };
  el.addEventListener('touchstart', fire, { passive: false });
  el.addEventListener('click', fire);
}

// objetivo sempre visível no topo: é o "alguém te ajudando a jogar"
game.onObjective = (txt) => {
  $('hint').innerHTML = '<b>' + STR.hud_obj + '</b>';
  $('hint').appendChild(document.createTextNode(txt));
};
game.onObjective(STR.obj_collect);

game.onEnd = (r) => {
  if (game.renderer.xr.isPresenting) return;
  $('r-title').textContent = r.won ? STR.win_title : STR.lose_title;
  $('r-body').textContent  = r.won ? STR.win_body  : STR.lose_body;
  const cells = [
    [STR.res_phase, r.phase, '#00E5FF'],
    [STR.res_frag, r.frags, '#FFC93C'],
    [STR.res_drones, r.drones, '#FF2D9B'],
    [STR.res_deaths, r.deaths, '#FF2D9B'],
  ];
  const grid = $('r-grid');
  grid.innerHTML = '';
  for (const [label, val, col] of cells) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.innerHTML = '<div class="n"></div><div class="l"></div>';
    d.querySelector('.n').style.color = col;
    d.querySelector('.n').textContent = val;
    d.querySelector('.l').textContent = label;
    grid.appendChild(d);
  }
  show('s-res');
};

const opt = (key, btn, label, apply) => {
  const el = $(btn);
  const draw = () => { el.textContent = `${label}: ${game.opts[key] ? STR.a11y_on : STR.a11y_off}`; };
  el.onclick = () => { game.opts[key] = !game.opts[key]; if (apply) apply(game.opts[key]); draw(); };
  draw();
};
opt('sound', 'b-sound', 'SOM', (v) => { game.sfx.setEnabled(v); if (!v) game.calaVoz(); });
opt('shake', 'b-shake', STR.a11y_shake.toUpperCase());
opt('flash', 'b-flash', STR.a11y_flash.toUpperCase());
opt('bigText', 'b-text', STR.a11y_text.toUpperCase(), (v) => document.body.classList.toggle('big', v));
opt('snapTurn', 'b-snap', STR.a11y_snap.toUpperCase());
opt('giroCabeca', 'b-head', STR.a11y_cabeca.toUpperCase());

// ---------------------------------------------------------------- HUD de tela
// No PC/celular a informação fica FIXA na tela (o painel de mundo é só VR).
$('hl-face').textContent = STR.hud_frag;
$('hl-time').textContent = STR.hud_time;
$('hl-lives').textContent = STR.hud_lives;
$('hl-mask').textContent = STR.hud_mask;
$('aya2d-name').textContent = STR.aya_name;

let lastFrags = -1, lastBannerT = null, tId = 0;
setInterval(() => {
  const s = game.s;
  const jogando = game.mode === 'playing' && s && !game.renderer.xr.isPresenting &&
    !document.querySelector('.screen.on');
  $('hud2d').classList.toggle('on', jogando);
  // o voltar some enquanto se joga e dentro do oculos, onde ele nem existe
  $('voltar-blog').classList.toggle('off', jogando || game.renderer.xr.isPresenting);
  if (!jogando) {
    $('aya2d').classList.remove('on'); $('banner2d').classList.remove('on');
    $('bossbar').classList.remove('on');
    lastFrags = -1; return;
  }

  // Barra do chefe: só na fase que tem chefe, só depois que ele ACORDA, e some
  // quando ele cai. Enquanto ele dorme no fundo da arena a barra não aparece —
  // ela entregava a luta antes de o jogador sequer chegar na porta.
  const bs = s.boss;
  const bossAtivo = !!bs && bs.hp > 0 && !bs.dormindo;
  $('bossbar').classList.toggle('on', bossAtivo);
  if (bossAtivo) {
    // A caixa de OBJETIVO fica no topo e muda de altura com a quebra de linha:
    // com posição fixa, a barra caía por cima dela. Aqui ela é empurrada para
    // logo abaixo, medindo a altura real da caixa a cada quadro.
    const rh = $('hint').getBoundingClientRect();
    $('bossbar').style.top = (rh.height ? rh.bottom + 10 : 16) + 'px';
    $('boss-nome').textContent = STR.boss_name;
    $('boss-lab').textContent = STR.hud_bossbar;
    $('bossfill').style.transform = `scaleX(${Math.max(0, bs.hp / bs.maxHp)})`;
    // o estágio é a informação que decide o que fazer no segundo seguinte
    $('boss-estagio').textContent =
      bs.fase === 'aberto' ? '◉ LENTE ABERTA — ATIRE'
      : bs.fase === 'rajada' ? '● RAJADA — DESVIE'
      : '≡ VARREDURA — AGACHE OU PULE';
    $('boss-estagio').style.color = bs.fase === 'aberto' ? 'var(--cyan)' : 'var(--gold)';
  }

  // números grandes e sempre no mesmo lugar
  if (s.hunt) {
    const dm = game.level.drones.filter(d => d.dead).length, dt2 = game.level.drones.length;
    $('hl-face').textContent = STR.hud_hunt;
    $('hv-face').textContent = `${s.masksGot}/${s.masksTotal} · ${dm}/${dt2}`;
    $('hv-face').className = 'big ' + (s.masksGot >= s.masksTotal && dm >= dt2 ? 'cyan' : 'gold');
  } else {
    $('hl-face').textContent = STR.hud_frag;
    $('hv-face').textContent = `${s.frags}/${s.need}`;
    $('hv-face').className = 'big ' + (s.frags >= s.need ? 'cyan' : 'gold');
  }
  const mm = Math.floor(s.left / 60), ss = String(Math.floor(s.left % 60)).padStart(2, '0');
  $('hv-time').textContent = `${mm}:${ss}`;
  $('hv-time').className = 'big' + (s.left < 20 ? ' mag' : '');
  $('hv-lives').innerHTML = Array.from({ length: 3 }, (_, i) =>
    `<span class="${i < s.lives ? '' : 'off'}"></span>`).join('');
  // o botao AGACHAR e liga/desliga: se o jogador morre agachado, o estado
  // some no respawn mas a luz do botao ficava acesa mentindo
  $('b-duck').classList.toggle('act', !!game.duckBtn);

  const heat = 1 - s.maskHeat / 5.5;
  $('maskfill').style.transform = `scaleX(${s.maskHave ? Math.max(0, heat) : 0})`;
  $('maskfill').style.background = s.maskLock > 0 ? 'var(--mag)' : s.maskOn ? 'var(--bone)' : 'var(--cyan)';
  $('hv-mask').textContent = !s.maskHave ? 'SEM' : s.maskLock > 0 ? STR.hud_overheat : (s.maskOn ? 'NO ROSTO' : 'E LIGA');
  $('hv-phase').textContent = `${STR.hud_phase} ${s.phase + 1}/5`;
  // verde a partir de 58, amarelo ate 45, vermelho abaixo disso. O "leve N"
  // aparece quando o jogo baixou a qualidade sozinho para segurar a taxa.
  if (game._pf) {
    const f = Math.round(game._pf.fps);
    const e = $('hv-fps');
    e.textContent = `${f} FPS${game._pf.grau ? ' · LEVE ' + game._pf.grau : ''}`;
    e.style.color = f >= 58 ? '#6BCB77' : f >= 45 ? '#FFC93C' : '#FF5A6E';
  }

  // fala da AYA como legenda fixa
  $('aya2d').classList.toggle('on', !!s.aya);
  if (s.aya) $('aya2d-text').textContent = s.aya;

  // banner central de fase
  const b = s.banner;
  if (b && b !== lastBannerT) {
    lastBannerT = b;
    $('banner2d-t').textContent = b.title || '';
    $('banner2d-s').textContent = b.sub || '';
    $('banner2d').classList.remove('on'); void $('banner2d').offsetWidth;
    $('banner2d').classList.add('on');
  }
  if (!b) { $('banner2d').classList.remove('on'); lastBannerT = null; }

  // toast de coleta: +ROSTO com o novo total
  if (lastFrags >= 0 && s.frags > lastFrags) {
    const t = $('toast');
    t.textContent = `+ ${STR.hud_frag} ${s.frags}/${s.need}`;
    t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
    clearTimeout(tId); tId = setTimeout(() => t.classList.remove('on'), 950);
  }
  // Em celular a caixa de OBJETIVO e o painel disputavam a mesma faixa do topo
  // e o painel ficava ilegivel. Aqui o painel e' empurrado para logo abaixo da
  // caixa, medindo a altura real dela (que muda com a quebra de linha).
  if (window.innerWidth < 820) {
    const r = $('hint').getBoundingClientRect();
    $('hud2d').style.top = (r.height ? r.bottom + 8 : 14) + 'px';
  } else {
    $('hud2d').style.top = '';
  }

  lastFrags = s.frags;
}, 120);

if (new URLSearchParams(location.search).has('dev')) {
  const d = $('dev'); d.style.display = 'block';
  let f = 0, t0 = performance.now();
  setInterval(() => {
    const now = performance.now();
    const s = game.s;
    d.textContent = `${Math.round(f * 1000 / (now - t0))} fps · draws ${game.renderer.info.render.calls}` +
      (s ? ` · fase ${s.phase + 1} · frag ${s.frags}/${s.need} · y ${game.pl.pos.y.toFixed(2)} · h ${game.pl.h.toFixed(2)} · solo ${game.pl.onGround}` : '');
    f = 0; t0 = now;
  }, 500);
  const raf = () => { f++; requestAnimationFrame(raf); };
  requestAnimationFrame(raf);
}
</script>
</body>
</html>
